version: "3.8"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend
    environment:
      - CORS_ORIGINS=https://localhost
    # Removed ports binding to force traffic through nginx

  frontend:
    build: ./frontend
    # Removed ports binding
